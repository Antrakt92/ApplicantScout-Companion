version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      exclude:
        - "github/codeql-action/*"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      workflow-actions:
        patterns:
          - "*"
