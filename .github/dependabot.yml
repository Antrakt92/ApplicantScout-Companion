version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 1
    ignore:
      # Windows symlink regression; fixed in 1.6.1.
      # https://build.pypa.io/en/stable/changelog.html
      - dependency-name: "build"
        versions: ["1.6.0"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 2
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      workflow-actions:
        patterns:
          - "*"
