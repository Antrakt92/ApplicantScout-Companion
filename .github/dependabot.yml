version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
